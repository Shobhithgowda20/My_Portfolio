<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | Shobhith Gowda N</title>

    <meta name="description" content="Thank you for contacting Shobhith Gowda N. Your message has been received successfully.">
    <meta name="author" content="Shobhith Gowda N">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>

<body>

    <div class="thank-you-page">

        <div class="thank-you-card">

            <div class="success-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>

            <h1>Message Sent Successfully!</h1>

            <p>
                Thank you for contacting me.<br>
                I'll get back to you soon.
            </p>

            <a href="./index.html" class="primary-button" id="backBtn">
                ← Back to Portfolio
            </a>
        </div>

    </div>

    <div id="pageLoader" class="page-loader">
      <div class="spinner"></div>
    </div>

    <script>
        const backBtn = document.getElementById("backBtn");
        const loader = document.getElementById("pageLoader");

        backBtn.addEventListener("click", function(e){
            e.preventDefault();

            loader.classList.add("show");

            setTimeout(() => {
                window.location.href = "./index.html";
            }, 900);
        });
    </script>

</body>

</html>
